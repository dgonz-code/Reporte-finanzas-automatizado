name: Reporte mensual
on:
  schedule:
    - cron: "0 12 2 * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar credenciales de Google
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json
      - run: python -m reporte.main
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_QUERY_CUENTA: ${{ secrets.GMAIL_QUERY_CUENTA }}
          GMAIL_QUERY_TARJETA: ${{ secrets.GMAIL_QUERY_TARJETA }}
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
